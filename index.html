<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einsatzplaner – Elektro Meisterbetrieb</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10141A;
  --panel:#181E27;
  --panel-2:#1F2733;
  --line:#2C3644;
  --line-soft:#232C38;
  --ink:#E8EDF4;
  --ink-dim:#8B98AA;
  --ink-faint:#5C6878;
  --focus:#7FD4FF;
  --radius:5px;
  --slot-h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  font-size:13px;display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}

header{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:0 1 auto;overflow:hidden}
.brand b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em}
.brand span{color:var(--ink-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1560px){.brand span{display:none}}

.views{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.views button{
  background:none;border:0;padding:6px 13px;
  font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.03em;
  color:var(--ink-dim);border-right:1px solid var(--line);
}
.views button:last-child{border-right:0}
.views button[aria-pressed="true"]{background:var(--focus);color:#0A1119;font-weight:600}

.navdate{display:flex;align-items:center;gap:8px}
.navdate .label{font-family:"Barlow Condensed",sans-serif;font-size:17px;min-width:160px;text-align:center;letter-spacing:.02em;white-space:nowrap}
.ghost{
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:6px 10px;color:var(--ink-dim);white-space:nowrap;
}
.ghost:hover{border-color:var(--focus);color:var(--ink)}
.ghost.heute{border-color:#2E4A5C;color:var(--focus)}
.ghost.heute:hover{background:#16222C;border-color:var(--focus)}
.spacer{flex:1}

main{flex:1;display:flex;min-height:0}
#stage{flex:1;min-width:0;overflow:auto;position:relative}

aside{
  flex:0 0 268px;border-left:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column;min-height:0;
}
aside h2{
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;
  margin:0;padding:11px 14px 9px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
aside h2 .count{color:var(--ink-faint);font-size:12px;font-family:Inter,sans-serif}
.pool{overflow:auto;padding:9px;display:flex;flex-direction:column;gap:7px;flex:1}
.jobcard{
  background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--ink-faint);
  border-radius:var(--radius);padding:8px 9px;cursor:grab;
}
.jobcard:active{cursor:grabbing}
.jobcard b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.jobcard small{color:var(--ink-dim);font-size:11.5px;line-height:1.35;display:block}
.jobcard .row{display:flex;gap:6px;margin-top:7px}
.jobcard .row button{
  flex:1;background:#141A23;border:1px solid var(--line);border-radius:4px;
  padding:3px 0;font-size:11px;color:var(--ink-dim);
}
.jobcard .row button:hover{color:var(--ink);border-color:var(--focus)}
.pool-empty{color:var(--ink-faint);padding:16px 6px;text-align:center;line-height:1.5}
.aside-foot{padding:9px;border-top:1px solid var(--line);display:flex;gap:7px}
.aside-foot button{flex:1;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel-2);padding:7px 0;font-size:12px}
.aside-foot button.primary{background:var(--focus);color:#0A1119;border-color:var(--focus);font-weight:600}

table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:660px;table-layout:fixed}
table.board th,table.board td{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:0}
table.board thead th{
  position:sticky;top:0;z-index:5;background:var(--panel);
  font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:14px;
  color:var(--ink-dim);padding:7px 6px;letter-spacing:.03em;border-bottom:1px solid var(--line);
}
table.board thead th.today{color:var(--focus);background:#16222C}
th.teamcol,td.teamcol{
  position:sticky;left:0;z-index:4;background:var(--panel);
  width:150px;min-width:150px;border-right:1px solid var(--line);
}
table.board thead th.teamcol{z-index:7;background:var(--panel)}
.teamcell{padding:8px 11px;display:flex;gap:9px;align-items:center;cursor:grab;position:relative}
.teamcell:active{cursor:grabbing}
.teamcell .tn{flex:1;min-width:0}
.teamcell.dragging{opacity:.4}
.teamcell.dropteam{background:#1B2735;box-shadow:inset 0 0 0 2px var(--focus)}
.order{display:flex;flex-direction:column;gap:2px;opacity:0;flex:0 0 auto}
.teamcell:hover .order{opacity:1}
.order button{
  background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  color:var(--ink-dim);font-size:8px;line-height:1;padding:3px 5px;
}
.order button:hover:not(:disabled){color:var(--ink);border-color:var(--focus)}
.order button:disabled{opacity:.25;cursor:default}
.swatch{width:5px;border-radius:3px;align-self:stretch;min-height:30px}
.teamcell b{font-size:13px;display:block}
.teamcell small{color:var(--ink-faint);font-size:11px;line-height:1.3;display:block;margin-top:2px}

td.trackcell{padding:0;position:relative}
.track{position:relative;display:grid;height:var(--slot-h);align-items:center}
.daybg{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none;border-right:1px solid var(--line-soft)}
.daybg.today{background:#16222C}
.daybg.monatsstart{border-left:2px solid #4A5566}
table.board thead th.monatsstart{border-left:2px solid #4A5566}

.bar{
  grid-row:1;position:relative;z-index:2;
  height:calc(var(--slot-h) - 8px);margin:0 2px;border-radius:5px;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:0 11px;color:#0C1117;font-size:13px;cursor:pointer;
  white-space:nowrap;overflow:hidden;
}
.bar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bar .adr{font-weight:500;font-size:11px;opacity:.75;overflow:hidden;text-overflow:ellipsis}
.bar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.bar.dragover{box-shadow:0 0 0 2px var(--focus)}
.bar.fix{cursor:pointer}
.bar .lock{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font-size:9px;line-height:1;opacity:.6;filter:grayscale(1) brightness(.2);pointer-events:none;
}
.fixnote.offen{background:#14241B;border-color:#2C4A36;color:#8FDCA4}
.fixnote{
  margin:0 0 15px;padding:10px 12px;border-radius:var(--radius);
  background:#2A2314;border:1px solid #4A3C22;color:#FFC978;
  font-size:11.5px;line-height:1.55;
}
.field input:disabled,.field select:disabled,.field textarea:disabled{opacity:.5;cursor:not-allowed}
.quick button:disabled,.btn:disabled{opacity:.4;cursor:not-allowed}
.bar.dragging{opacity:.4}
aside.dropzone{background:#1B2735;box-shadow:inset 0 0 0 2px var(--focus)}
aside.dropzone .pool::before{
  content:"Hier loslassen – Auftrag wandert zurück in die Liste";
  display:block;border:1px dashed var(--focus);border-radius:var(--radius);
  padding:11px 9px;color:var(--focus);font-size:11.5px;line-height:1.4;text-align:center;
}

.gap{grid-row:1;position:relative;z-index:1;height:100%;cursor:pointer}
.gap::after{
  content:attr(data-slot);position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:10px;opacity:0;pointer-events:none;
}
.gap:hover{background:#1B2735;box-shadow:inset 0 0 0 1px var(--focus)}
.gap:hover::after{opacity:1}
.gap.dragover{background:#203243;box-shadow:inset 0 0 0 2px var(--focus)}

table.month{min-width:2050px;table-layout:fixed}
table.month .track{height:34px}
table.month .bar{height:26px;font-size:11px;padding:0 7px;margin:0 2px;border-radius:4px}
table.month .bar .adr{display:none}
table.month thead th{font-size:12px;padding:5px 2px}

.now-wrap{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.nowcard{
  background:var(--panel);border:1px solid var(--line);border-radius:7px;
  border-top:4px solid var(--ink-faint);padding:13px 14px;
}
.nowcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nowcard h3{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em}
.nowcard .crew{color:var(--ink-faint);font-size:11.5px}
.nowcard .job{font-size:14px;font-weight:600;margin:11px 0 3px}
.nowcard .adr{color:var(--ink-dim);font-size:12px;line-height:1.4}
.progress{height:7px;border-radius:4px;background:#232C38;margin:13px 0 7px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-dim)}
.times b{color:var(--ink);font-weight:600}
.nowcard .free{color:var(--ink-faint);font-style:italic;margin:13px 0 4px;font-size:13px}
.nowcard .acts{display:flex;gap:7px;margin-top:12px}
.nowcard .acts button{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 0;font-size:11.5px;color:var(--ink-dim)}
.nowcard .acts button:hover{color:var(--ink);border-color:var(--focus)}

#mapview{position:absolute;inset:0;display:flex;flex-direction:column}
#mapbar{
  display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;
}
#mapbar .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-dim)}
.leg i{width:10px;height:10px;border-radius:3px;display:block}
#map{flex:1;background:#0C1015}
.pin{
  display:flex;align-items:center;gap:5px;padding:3px 7px 3px 4px;border-radius:13px;
  font:600 11px Inter,sans-serif;color:#0C1117;white-space:nowrap;
  box-shadow:0 2px 7px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85);
}
.pin.dim{opacity:.5}
.pin .dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.45);flex:0 0 auto}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:6px}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:10px 13px;font-size:12.5px;line-height:1.5}
.leaflet-popup-content b{font-size:13.5px}

dialog{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:0;width:min(520px,92vw);box-shadow:0 22px 60px rgba(0,0,0,.6);
}
dialog::backdrop{background:rgba(6,9,13,.72)}
dialog h3{
  margin:0;padding:14px 18px;border-bottom:1px solid var(--line);
  font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;
}
.dlg-body{padding:16px 18px;max-height:72vh;overflow:auto}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--ink-dim);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:#0F141B;border:1px solid var(--line);border-radius:4px;
  padding:8px 10px;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);padding:8px 15px;font-size:12.5px}
.btn.primary{background:var(--focus);border-color:var(--focus);color:#0A1119;font-weight:600}
.btn.danger{color:#FF8B8B;border-color:#4A2B32}
.btn.warn{color:#FFC978;border-color:#4A3C22}
.btn.warn:hover{border-color:#FFC978}
.btn:hover{border-color:var(--focus)}
.rowlist{display:flex;flex-direction:column;gap:8px}
.rowitem{display:flex;gap:9px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.rowitem input[type=text]{flex:1;background:#0F141B;border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--ink)}
.rowitem input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.rowitem .x{background:none;border:0;color:var(--ink-faint);font-size:17px;padding:0 4px}
.rowitem .x:hover{color:#FF8B8B}
.hint{color:var(--ink-faint);font-size:11.5px;line-height:1.5;margin-top:-4px}
.geo-ok{color:#6FD48A}.geo-no{color:#FFB65C}
.pair{display:flex;gap:8px}
.pair input{flex:1;min-width:0}
.pair select{flex:0 0 150px}
.quick{display:flex;gap:7px}
.quick button{
  flex:1;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 0;font-size:12px;color:var(--ink-dim);
}
.quick button:hover{border-color:var(--focus);color:var(--ink)}
.quick button.on{background:var(--focus);border-color:var(--focus);color:#0A1119;font-weight:600}
.searchbox{position:relative;flex:1 1 180px;min-width:130px;max-width:260px}
.searchbox input{
  width:100%;background:#0F141B;border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 11px;color:var(--ink);font-size:12.5px;
}
.searchbox input:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
.searchbox input::placeholder{color:var(--ink-faint)}

.cnt{color:var(--ink-faint);font-size:11px}
.drop{border:1px dashed var(--line);border-radius:var(--radius);padding:10px;background:#0F141B}
.drop.over{border-color:var(--focus);background:#1B2735}
.dropnote{color:var(--ink-faint);font-size:11.5px;text-align:center;padding:4px 0 2px}
.linky{background:none;border:0;color:var(--focus);text-decoration:underline;font-size:11.5px;padding:0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.files:empty{display:none}
.att{position:relative;border-radius:5px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);aspect-ratio:1}
.att img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.att .doc{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--ink-dim);font-size:9.5px;text-align:center;padding:5px;cursor:pointer;
}
.att .doc b{font-size:17px;font-weight:400}
.att .doc span{overflow:hidden;text-overflow:ellipsis;width:100%;white-space:nowrap}
.att .del{
  position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;
  background:rgba(8,12,17,.78);border:0;color:#FFB0B0;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;opacity:0;
}
.att:hover .del{opacity:1}
.att .del:hover{background:#7A2B33;color:#fff}
#vwImg{max-width:min(880px,88vw);max-height:62vh;display:block}

.srch{padding:16px;max-width:980px}
.srch h2{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:600;margin:0 0 3px;letter-spacing:.02em}
.srch .sub{color:var(--ink-faint);font-size:12px;margin-bottom:16px}
.hit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:11px}
.hit .top{display:flex;justify-content:space-between;gap:14px;align-items:baseline;flex-wrap:wrap}
.hit b{font-size:15px}
.hit .adr{color:var(--ink-dim);font-size:12.5px;margin-top:2px}
.hit .meta{color:var(--ink-faint);font-size:11.5px;margin-top:2px}
.runs{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.run{
  display:flex;align-items:center;gap:6px;border-radius:13px;padding:3px 10px 3px 4px;
  font-size:11.5px;font-weight:600;color:#0C1117;cursor:pointer;border:0;
}
.run .d{background:rgba(0,0,0,.2);border-radius:10px;padding:1px 6px;font-weight:500}
.srch .none{color:var(--ink-faint);padding:28px 4px;line-height:1.6}

.kontext{
  position:fixed;z-index:60;min-width:226px;
  background:var(--panel);border:1px solid var(--line);border-radius:7px;
  box-shadow:0 14px 40px rgba(0,0,0,.6);padding:5px;
}
.kontext .kopf{padding:8px 10px 7px;border-bottom:1px solid var(--line);margin-bottom:5px}
.kontext .kopf b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kontext .kopf small{color:var(--ink-faint);font-size:11px}
.kontext button{
  display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;
  padding:8px 10px;border-radius:4px;font-size:12.5px;color:var(--ink-dim);text-align:left;
}
.kontext button:hover{background:var(--panel-2);color:var(--ink)}
.kontext button .pkt{width:9px;height:9px;border-radius:2px;flex:0 0 auto}

.bar.abger{background:#6B7585 !important;color:#161B22}
.bar.abger .nm{font-weight:500}
.bar.abger .adr{opacity:.65}
.swatch.abger{background:#6B7585 !important}

.kdlist{display:flex;flex-direction:column;gap:8px}
.kdrow{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;
}
.kdrow:hover{border-color:var(--focus)}
.kdrow b{font-size:13px;display:block}
.kdrow small{color:var(--ink-dim);font-size:11.5px;display:block;margin-top:2px;line-height:1.4}
.kdrow .n{color:var(--ink-faint);font-size:11px;white-space:nowrap}
.kdlist .pool-empty{padding:22px 6px}
.kdbox{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;margin-bottom:14px;
}
.kdbox .who{font-size:13.5px;font-weight:600}
.kdbox .det{color:var(--ink-dim);font-size:12px;line-height:1.5;margin-top:3px}
.kdbox .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.kdbox .acts a,.kdbox .acts button{
  background:#141A23;border:1px solid var(--line);border-radius:4px;
  padding:7px 12px;font-size:12px;color:var(--ink-dim);text-decoration:none;display:inline-block;
}
.kdbox .acts a:hover,.kdbox .acts button:hover{color:var(--ink);border-color:var(--focus)}
.kdbox .acts a.wa{color:#6FD48A;border-color:#2C4A36}
.kdbox .acts a.wa:hover{border-color:#6FD48A}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div class="brand"><b>Einsatzplaner</b><span id="companyName">Elektro Meisterbetrieb</span></div>

  <div class="views" role="group" aria-label="Ansicht">
    <button data-view="now">Jetzt</button>
    <button data-view="week">Woche</button>
    <button data-view="month">Monat</button>
    <button data-view="map">Karte</button>
  </div>

  <div class="navdate">
    <button class="ghost" id="prev" aria-label="Zurück">◀</button>
    <div class="label" id="periodLabel"></div>
    <button class="ghost" id="next" aria-label="Vor">▶</button>
    <button class="ghost heute" id="today" title="Zum heutigen Tag springen">Heute</button>
  </div>

  <div class="spacer"></div>
  <div class="searchbox">
    <input type="search" id="qSearch" placeholder="Objekt oder Straße suchen …" autocomplete="off">
  </div>

const PALETTE = ["#F2B01E","#2FA8E0","#E04F5F","#59C26A","#A77BF3","#FF8A3D","#35D0C3","#E86BB0","#9FD356","#6E8BFF"];

const SUPABASE_URL = 'https://ehoygnjlyqwhpsevtgtf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AItKYP4npF-bG6O8FZyI3Q_F4rZ0iAD';

let supabaseClient = null;
let state = null;

const Files = (() => {
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{
      const r=indexedDB.open("einsatzplaner-dateien",1);
      r.onupgradeneeded=()=>{
        const st=r.result.createObjectStore("files",{keyPath:"id"});
        st.createIndex("jobId","jobId",{unique:false});
      };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }).catch(e=>{ dbp=null; throw e; });
    return dbp;
  }
  const tx=async(mode,fn)=>{
    const db=await open();
    return new Promise((res,rej)=>{
      const t=db.transaction("files",mode);
      const out=fn(t.objectStore("files"));
      t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);
      t.onerror=()=>rej(t.error);
    });
  };
  return {
    async add(jobId,file){
      const rec={id:Math.random().toString(36),jobId,name:file.name||"Datei",type:file.type||"",size:file.size||0,added:new Date().toISOString(),blob:file};
      await tx("readwrite",st=>st.put(rec));
      return rec;
    },
    async forJob(jobId){
      try{
        const db=await open();
        return await new Promise((res,rej)=>{
          const out=[];
          const t=db.transaction("files","readonly");
          const rq=t.objectStore("files").index("jobId").openCursor(IDBKeyRange.only(jobId));
          rq.onsuccess=()=>{ const c=rq.result; if(c){ out.push(c.value); c.continue(); } };
          t.oncomplete=()=>res(out);
          t.onerror=()=>rej(t.error);
        });
      }catch(e){ return []; }
    },
    async all(){
      try{
        const db=await open();
        return await new Promise((res,rej)=>{
          const rq=db.transaction("files","readonly").objectStore("files").getAll();
          rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error);
        });
      }catch(e){ return []; }
    },
    async remove(id){ try{ await tx("readwrite",st=>st.delete(id)); }catch(e){} },
    async counts(){
      try {
        const m={}; (await this.all()).forEach(f=>m[f.jobId]=(m[f.jobId]||0)+1); return m;
      }catch(e){ return {}; }
    }
  };
})();

let fileCounts={};
const istFixiert = jobId => (fileCounts[jobId]||0) > 0;
function fixHinweis(jobId){
  const n=fileCounts[jobId]||0;
  return `Dieser Einsatz ist durch ${n} Foto(s) belegt und festgehalten.`;
}
async function refreshCounts(){ fileCounts=await Files.counts(); }

const istBild = t => /^image\//.test(t||"");
const uid = () => Math.random().toString(36).slice(2,10);

  const teams = [
    t("Team 1","#F2B01E",["Anton","Igor"]),
    t("Team 2","#2FA8E0",["Murat","Kevin"]),
    t("Team 3","#E04F5F",["Sergej","Daniel"])
  ];
  const jobs = [
    j("Zählerschrank + Unterverteilung","Julius-Rietz-Straße 6, 40231 Düsseldorf",51.2170,6.8010,"Andreas"),
    j("Elektroinstallation Büroetage","Neuburgstraße 4, 40223 Düsseldorf",51.2280,6.7800,"Raum Pro Team")
  ];
  const A=[], d=new Date(); d.setHours(0,0,0,0);
  const mon = new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const add=(ti,ji,off,slots)=>{const dt=new Date(mon);dt.setDate(mon.getDate()+off);
    slots.forEach(s=>A.push({id:uid(),teamId:teams[ti].id,jobId:jobs[ji].id,date:iso(dt),slot:s}));};
  [0,1].forEach(o=>add(0,0,o,["AM","PM"]));
  return {teams,jobs,customers:[],assignments:A,settings:{company:"Elektro Meisterbetrieb",amStart:"07:00",amEnd:"12:00",pmStart:"12:30",pmEnd:"16:30"}};
}

async function initSupabaseAndLoad() {
  if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 2000);
    const { data, error } = await supabaseClient.from('schedule_data').select('content').eq('id', 1).single();
    clearTimeout(timeoutId);
    if (error) throw error;
    if (data && data.content && data.content !== '{}') {
      state = JSON.parse(data.content);
    } else {
      state = demoState();
    }
  } catch (err) {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      state = raw ? JSON.parse(raw) : demoState();
    } catch (e) {
      state = demoState();
    }
  }
  if (!state || !state.settings) state = demoState();
  if (!Array.isArray(state.customers)) state.customers = [];
  await refreshCounts();
  renderPool();
  render();
}

async function save() {
  if (!state) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
  if (supabaseClient) {
    try {
      await supabaseClient.from('schedule_data').update({ content: JSON.stringify(state), updated_at: new Date().toISOString() }).eq('id', 1);
    } catch (err) {}
  }
}

const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const DSHORT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parse(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
const todayISO = ()=>iso(new Date());

let zoomWeek=null;
let monthVisible=12;
let pendingScrollToday=true;
let view="month";
let anchor=new Date(); anchor.setHours(0,0,0,0);
let mapFocusJob=null, mapDay=todayISO();

const teamById=id=>state.teams.find(t=>t.id===id);
const kundeById=id=>state.customers.find(k=>k.id===id);
const jobById=id=>state.jobs.find(j=>j.id===id);
const assignAt=(teamId,date,slot)=>state.assignments.find(a=>a.teamId===teamId&&a.date===date&&a.slot===slot);
const assignsOn=date=>state.assignments.filter(a=>a.date===date);
function plannedJobIds(){return new Set(state.assignments.map(a=>a.jobId));}

function neighborSlot(dateStr,slot,dir){
  if(dir<0) return slot==="PM" ? [dateStr,"AM"] : [iso(addDays(parse(dateStr),-1)),"PM"];
  return slot==="AM" ? [dateStr,"PM"] : [iso(addDays(parse(dateStr),1)),"AM"];
}

function runFor(teamId,jobId,dateStr,slot){
  const order=["AM","PM"];
  const step=(d,s,dir)=>{
    let i=order.indexOf(s)+dir, day=d;
    if(i<0){i=1;day=iso(addDays(parse(d),-1));}
    if(i>1){i=0;day=iso(addDays(parse(d),1));}
    return [day,order[i]];
  };
  let first=[dateStr,slot], last=[dateStr,slot], count=1;
  for(;;){const p=step(first[0],first[1],-1),a=assignAt(teamId,p[0],p[1]);
    if(a&&a.jobId===jobId){first=p;count++;}else break;}
  for(;;){const p=step(last[0],last[1],1),a=assignAt(teamId,p[0],p[1]);
    if(a&&a.jobId===jobId){last=p;count++;}else break;}
  return {first,last,count};
}

const stage=document.getElementById("stage");

function render(){
  if(!state) return;
  document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===view));
  document.getElementById("companyName").textContent=state.settings.company;
  renderPeriodLabel();
  if(view==="week") renderWeek();
  else if(view==="month") renderMonth();
  else if(view==="map") renderMap();
  else renderWeek();
  renderPool();
}

function renderPeriodLabel(){
  const l=document.getElementById("periodLabel");
  if(view==="week"){
    const m=mondayOf(anchor), e=addDays(m,6);
    l.textContent = `${m.getDate()}.–${e.getDate()}. ${MONTHS[e.getMonth()]} ${e.getFullYear()}`;
  }else if(view==="month"){
    const a=new Date(anchor.getFullYear(),anchor.getMonth(),1);
    l.textContent = `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  }else if(view==="map"){
    const d=parse(mapDay);
    l.textContent=`${DSHORT[(d.getDay()+6)%7]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}`;
  }else{
    l.textContent="Übersicht";
  }
}

function buildBoard(dates,isMonth){
  const n=dates.length;
  const tbl=document.createElement("table");
  tbl.className="board"+(isMonth?" month":"");
  const th=document.createElement("thead"), tr=document.createElement("tr");
  tr.innerHTML=`<th class="teamcol">Team</th>`;
  dates.forEach(d=>{
    const h=document.createElement("th");
    h.textContent=isMonth?`${DSHORT[(d.getDay()+6)%7]} ${d.getDate()}.${d.getMonth()+1}.`:`${DAYS[(d.getDay()+6)%7]} ${d.getDate()}.${d.getMonth()+1}.`;
    let kl=[];
    if(iso(d)===todayISO()) kl.push("today");
    if(d.getDate()===1) kl.push("monatsstart");
    h.className=kl.join(" ");
    tr.appendChild(h);
  });
  th.appendChild(tr); tbl.appendChild(th);

  const tb=document.createElement("tbody");
  state.teams.forEach((team,ti)=>{
    const row=document.createElement("tr");
    row.appendChild(buildTeamCell(team,ti,state.teams.length));

    const td=document.createElement("td"); td.colSpan=n; td.className="trackcell";
    const track=document.createElement("div"); track.className="track";
    track.style.gridTemplateColumns=`repeat(${n*2},1fr)`;

    dates.forEach((d,i)=>{
      const bg=document.createElement("div");
      bg.className="daybg"+(iso(d)===todayISO()?" today":"")+(d.getDate()===1&&i>0?" monatsstart":"");
      bg.style.left=(i*100/n)+"%"; bg.style.width=(100/n)+"%";
      track.appendChild(bg);
    });

    const units=[];
    dates.forEach(d=>{const ds=iso(d);["AM","PM"].forEach(s=>units.push({ds,s,a:assignAt(team.id,ds,s)}));});

    let i=0;
    while(i<units.length){
      const u=units[i];
      if(u.a){
        let j=i+1;
        while(j<units.length && units[j].a && units[j].a.jobId===u.a.jobId) j++;
        track.appendChild(makeBar(team,u.a.jobId,units[i],units[j-1],j-i,isMonth));
        i=j;
      }else{
        let span=1, full=false;
        if(u.s==="AM" && units[i+1] && units[i+1].ds===u.ds && !units[i+1].a){span=2;full=true;}
        track.appendChild(makeGap(team,u.ds,u.s,span,full));
        i+=span;
      }
    }
    td.appendChild(track); row.appendChild(td); tb.appendChild(row);
  });
  tbl.appendChild(tb);
  return tbl;
}

function buildTeamCell(team,idx,total){
  const tc=document.createElement("td"); tc.className="teamcol";
  const inner=document.createElement("div"); inner.className="teamcell";
  inner.innerHTML=`<span class="swatch" style="background:${team.color}"></span>
    <span class="tn"><b>${esc(team.name)}</b><small>${esc(team.members.join(", ")||"–")}</small></span>`;
  tc.appendChild(inner); return tc;
}

function makeBar(team,jobId,firstU,lastU,span,isMonth){
  const job=jobById(jobId)||{name:"?",address:""};
  const fix=istFixiert(jobId);
  const abger=!!job.billed;
  const b=document.createElement("div");
  b.className="bar"+(fix?" fix":"")+(abger?" abger":"");
  b.style.gridColumn="span "+span;
  b.style.background=team.color;
  b.innerHTML=isMonth?`<span class="nm">${esc(job.name)}</span>`:`<span class="nm">${esc(job.name)}</span>`;
  b.onclick=()=>openRun(team.id,jobId,firstU.ds,firstU.s);
  return b;
}

function makeGap(team,ds,slot,span,full){
  const c=document.createElement("div");
  c.className="gap";
  c.style.gridColumn="span "+span;
  c.onclick=()=>openAssign(team.id,ds,slot);
  return c;
}

function renderWeek(){
  const m=mondayOf(anchor);
  stage.replaceChildren(buildBoard(Array.from({length:7},(_,i)=>addDays(m,i)),false));
}

function monatsTage(){
  const y=anchor.getFullYear(), mo=anchor.getMonth();
  const start=new Date(y,mo,1);
  const ende=new Date(y,mo+1,0);
  const tage=[];
  for(let d=new Date(start); d<=ende; d=addDays(d,1)) tage.push(new Date(d));
  return tage;
}

function renderMonth(){
  const tage=monatsTage();
  const tbl=buildBoard(tage,true);
  stage.replaceChildren(tbl);
}

const short=(s,n)=>!s?"":(s.length>n?s.slice(0,n-1)+"…":s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderPool(){
  const pool=document.getElementById("pool");
  const planned=plannedJobIds();
  const list = state.jobs.filter(j=>!planned.has(j.id));
  document.getElementById("poolCount").textContent = `${list.length} ungeplant`;
  pool.replaceChildren();
  if(!list.length){
    const p=document.createElement("div"); p.className="pool-empty";
    p.textContent="Alles verplant.";
    pool.appendChild(p); return;
  }
  list.forEach(j=>{
    const c=document.createElement("div"); c.className="jobcard";
    c.innerHTML=`<b>${esc(j.name)}</b><small>${esc(j.address||"keine Adresse")}</small>
      <div class="row"><button data-e="${j.id}">Bearbeiten</button></div>`;
    c.querySelector("[data-e]").onclick=()=>openJob(j.id);
    pool.appendChild(c);
  });
}

function renderMap(){
  const wrap=document.createElement("div"); wrap.id="mapview";
  wrap.innerHTML=`<div id="mapbar"><span style="color:var(--ink-dim)">Kartenansicht</span></div><div id="map"></div>`;
  stage.replaceChildren(wrap);
  if(typeof L==="undefined") return;
  if(map){ map.remove(); map=null; }
  map=L.map("map").setView([51.45,6.9],9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
}

// Dialogs & Buttons wiring
const dlgAssign=document.getElementById("dlgAssign");
const dlgJob=document.getElementById("dlgJob");
const dlgCustomers=document.getElementById("dlgCustomers");
const dlgCustomer=document.getElementById("dlgCustomer");
const dlgTeams=document.getElementById("dlgTeams");
const dlgSettings=document.getElementById("dlgSettings");
const dlgData=document.getElementById("dlgData");
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());

document.getElementById("btnKunden").onclick=()=>openKunden();
document.getElementById("btnTeams").onclick=()=>openTeams();
document.getElementById("btnSettings").onclick=()=>openSettings();
document.getElementById("btnData").onclick=()=>dlgData.showModal();
document.getElementById("btnNewJob").onclick=()=>openJob(null);

function openKunden(){
  const list=document.getElementById("kdList"); list.replaceChildren();
  state.customers.forEach(k=>{
    const row=document.createElement("div"); row.className="kdrow";
    row.innerHTML=`<div><b>${esc(k.company)}</b><small>${esc(k.contact||"")}</small></div>`;
    list.appendChild(row);
  });
  dlgCustomers.showModal();
}
document.getElementById("kdAdd").onclick=()=>openCustomer(null);
function openCustomer(id){ dlgCustomer.showModal(); }

function openTeams(){
  const list=document.getElementById("teamList"); list.replaceChildren();
  state.teams.forEach(t=>{
    const row=document.createElement("div"); row.className="rowitem";
    row.innerHTML=`<input type="color" value="${t.color}"><input type="text" value="${esc(t.name)}" style="flex:1">`;
    list.appendChild(row);
  });
  dlgTeams.showModal();
}

function openSettings(){
  stCompany.value=state.settings.company;
  stAmS.value=state.settings.amStart;
  stAmE.value=state.settings.amEnd;
  stPmS.value=state.settings.pmStart;
  stPmE.value=state.settings.pmEnd;
  dlgSettings.showModal();
}
document.getElementById("stSave").onclick=()=>{
  state.settings.company=stCompany.value;
  state.settings.amStart=stAmS.value;
  state.settings.amEnd=stAmE.value;
  state.settings.pmStart=stPmS.value;
  state.settings.pmEnd=stPmE.value;
  save(); dlgSettings.close(); render();
};

function openJob(id){
  jobEditId=id||uid();
  const j=id?jobById(id):{name:"",address:""};
  jbName.value=j.name; jbAdr.value=j.address||"";
  dlgJob.showModal();
}
let jobEditId=null;
document.getElementById("jbSave").onclick=()=>{
  if(!jbName.value.trim()) return;
  const data={id:jobEditId,name:jbName.value.trim(),address:jbAdr.value.trim()};
  const ex=jobById(jobEditId);
  if(ex) Object.assign(ex,data); else state.jobs.push(data);
  save(); dlgJob.close(); render(); renderPool();
};

function openAssign(teamId,date,slot){
  dlgAssign.showModal();
}
function openRun(teamId,jobId,date,slot){
  dlgAssign.showModal();
}

document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{
  view=b.dataset.view;
  render();
});
document.getElementById("prev").onclick=()=>shift(-1);
document.getElementById("next").onclick=()=>shift(1);
document.getElementById("today").onclick=()=>{
  anchor=new Date(); anchor.setHours(0,0,0,0);
  render();
};
function shift(n){
  if(view==="week") anchor=addDays(anchor,7*n);
  else if(view==="month") anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);
  render();
}

initSupabaseAndLoad();
</script>
</body>
</html>
