<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Einsatzplaner</title><link rel="stylesheet" href="https://unpkg.com"><script src="https://unpkg.com"></script><script src="https://jsdelivr.net"></script><style>:root{--bg:#10141A;--panel:#181E27;--panel-2:#1F2733;--line:#2C3644;--ink:#E8EDF4;--focus:#7FD4FF;--radius:6px;--slot-h:80px}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:sans-serif;overflow:hidden}.cloud-bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:10px 20px;border-bottom:1px solid var(--line);font-size:14px;height:45px}.cloud-status{color:#8b98aa;font-weight:500;display:flex;align-items:center;gap:8px}.cloud-status::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80}.cloud-btn{background:#2563eb;color:#fff;border:none;padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-weight:600;transition:background .2s}.cloud-btn:hover{background:#1d4ed8}.app-container{display:flex;height:calc(100% - 45px);width:100%}.sidebar{width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.main-content{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.section-header{padding:16px 20px;font-size:18px;font-weight:600;border-bottom:1px solid var(--line);background:rgba(24,30,39,.5)}.content-scroll{padding:20px;overflow-y:auto;flex:1}.auftrag-card{background:var(--panel-2);padding:14px;margin-bottom:12px;border-radius:var(--radius);border:1px solid var(--line);cursor:grab}.auftrag-id{font-size:15px;font-weight:700;color:var(--focus);margin-bottom:4px}.auftrag-title{font-size:13px;color:var(--ink);line-height:1.4}.planner-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.planner-table th{background:rgba(24,30,39,.8);color:#8b98aa;font-size:14px;font-weight:600;padding:12px;border-bottom:1px solid var(--line);text-transform:uppercase}.planner-table td{padding:0;border-bottom:1px solid #232c38;border-right:1px solid #232c38;height:var(--slot-h);vertical-align:top}.planner-table td:last-child{border-right:none}.team-cell{padding:15px;font-weight:600;font-size:14px;display:flex;align-items:center;height:100%}.drop-slot{width:100%;height:100%;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:var(--slot-h)}.empty-text{color:#5c6878;font-size:12px;font-style:italic;display:flex;align-items:center;height:100%}#map{height:250px;border-top:1px solid var(--line);background:var(--bg)}</style></head><body><div class="cloud-bar"><div><strong>Einsatzplaner — Meisterbetrieb v1.2</strong></div><div><span id="cloud-status" class="cloud-status">Cloud bereit (Автономный режим)</span><button id="save-cloud-btn" class="cloud-btn" onclick="saveToCloud()" style="margin-left:15px">In der Cloud speichern</button></div></div><div class="app-container"><div class="sidebar"><div class="section-header">Auftragspool (Заказы)</div><div id="pool-list" class="content-scroll"></div><div class="section-header" style="border-top:1px solid var(--line)">Karte / Карты</div><div id="map"></div></div><div class="main-content"><div class="section-header">Einsatzplan (Расписание бригад)</div><div class="content-scroll"><table class="planner-table"><thead><tr><th style="width:220px;text-align:left;padding-left:15px">Team / Бригада</th><th style="width:40px">Vormittag (Утро)</th><th>Nachmittag (День)</th></tr></thead><tbody id="planner-rows"></tbody></table></div></div></div><script>const SUPABASE_URL="https://supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVob3lnbmpseXF3aHBzZXZ0Z3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE0NzYxNDYwNDAsImV4cCI6MjQ3NjE0NjA0MH0.1",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let state={teams:["Team A (Müller/Weber)","Team B (Schmidt/Hoffmann)","Team C (Wagner/Schneider)"],jobs:[{id:"Z-2026-01",name:"Neubau EFH — Hauptstraße 14, Oberhausen",lat:51.4696,lng:6.8649},{id:"Z-2026-02",name:"Zählerwechsel — Westweg 3b, Mülheim",lat:51.4271,lng:6.8824},{id:"Z-2026-03",name:"Industrieanlage — Nordring 120, Essen",lat:51.4556,lng:7.0116},{id:"Z-2026-04",name:"Wohnungsbau — Südstraße 45, Duisburg",lat:51.4344,lng:6.7623}],calendar:{}};let map;function initMap(){try{map=L.map('map').setView([51.4556,6.8824],10),L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png').addTo(map),state.jobs.forEach(e=>L.marker([e.lat,e.lng]).addTo(map).bindPopup(`<b>${e.id}</b><br>${e.name}`))}catch(e){console.error(e)}}function render(){document.getElementById('pool-list').innerHTML=state.jobs.map(e=>`<div class="auftrag-card" draggable="true" ondragstart="event.dataTransfer.setData('text','${e.id}')"><div class="auftrag-card"><div class="auftrag-id">${e.id}</div><div class="auftrag-title">${e.name}</div></div></div>`).join(''),document.getElementById('planner-rows').innerHTML=state.teams.map((e,t)=>{const a=state.calendar[`${t}-m`]||'',n=state.calendar[`${t}-a`]||'',r=state.jobs.find(e=>e.id===a),l=state.jobs.find(e=>e.id===n);return`<tr><td><div class="team-cell">${e}</div></td><td ondragover="event.preventDefault()" ondrop="drop(event,'${t}-m')"><div class="drop-slot">${r?`<div class="auftrag-card" style="margin:0;border-color:var(--focus)"><b>\${r.id}</b><span style="float:right;cursor:pointer" onclick="removeJob('t-m')">✕</span><br>{r.name}</div>`:`<span class="empty-text">Kein Einsatz</span>`}</div></td><td ondragover="event.preventDefault()" ondrop="drop(event,'${t}-a')"><div class="drop-slot">${l?`<div class="auftrag-card" style="margin:0;border-color:var(--focus)"><b>\${l.id}</b><span style="float:right;cursor:pointer" onclick="removeJob('t-a')">✕</span><br>{l.name}</div>`:`<span class="empty-text">Kein Einsatz</span>`}</div></td></tr>`}).join('')}function drop(e,t){e.preventDefault();const a=e.dataTransfer.getData('text');a&&(state.calendar[t]=a,render())}function removeJob(e){delete state.calendar[e],render()}async function saveToCloud(){const e=document.getElementById('save-cloud-btn');e.disabled=!0;const{error:t}=await supabaseClient.from('planer_data').update({config_json:state}).eq('id',1);alert(t?"Fehler beim Speichern":"Erfolgreich gespeichert!"),e.disabled=!1}async function start(){render(),initMap();try{let{data:e}=await supabaseClient.from('planer_data').select('config_json').eq('id',1).single();e?.config_json&&Object.keys(e.config_json).length>0&&(state=e.config_json,render())}catch(e){console.error(e)}}window.onload=start;</script></body></html>
