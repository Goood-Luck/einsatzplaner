<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einsatzplaner - Elektro Meisterbetrieb</title>
    <link rel="stylesheet" href="https://unpkg.com">
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --bg: #10141A; --panel: #181E27; --panel-2: #1F2733; --line: #2C3644; --ink: #E8EDF4; --focus: #7FD4FF; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: sans-serif; overflow: hidden; }
        .cloud-bar { display: flex; justify-content: space-between; padding: 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
        .app { display: flex; height: calc(100vh - 45px); }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
        .main { flex: 1; padding: 20px; }
        .card { background: var(--panel-2); padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--line); cursor: grab; }
        .table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
        .table th, .table td { padding: 15px; border: 1px solid var(--line); text-align: left; }
        #map { height: 200px; background: #000; border-top: 1px solid var(--line); }
    </style>
</head>
<body>
<div class="cloud-bar">
    <div><strong>Einsatzplaner Cloud v1.2</strong></div>
    <div><span style="color:#4ade80">● Cloud synchronisiert</span><button onclick="save()" style="background:#2563eb; color:#fff; border:none; padding:5px 10px; margin-left:15px; cursor:pointer; border-radius:4px;">Speichern</button></div>
</div>
<div class="app">
    <div class="sidebar">
        <div style="padding:15px; font-weight:bold; border-bottom:1px solid var(--line)">Auftragspool</div>
        <div id="pool" style="padding:15px; flex:1; overflow-y:auto;"></div>
        <div id="map"></div>
    </div>
    <div class="main">
        <table class="table">
            <thead><tr><th>Team / Бригада</th><th>Vormittag (Утро)</th><th>Nachmittag (День)</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>
<script>
    const supabaseClient = supabase.createClient("https://supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVob3lnbmpseXF3aHBzZXZ0Z3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE0NzYxNDYwNDAsImV4cCI6MjQ3NjE0NjA0MH0.1");
    let state = { teams: ["Team A (Müller)", "Team B (Schmidt)", "Team C (Wagner)"], jobs: [{id:"Z-01", name:"Hauptstr. 14"}, {id:"Z-02", name:"Westweg 3b"}], cal: {} };
    let map;
    function initMap() { map = L.map('map').setView([51.4556, 6.8824], 10); L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png').addTo(map); }
    function render() {
        document.getElementById('pool').innerHTML = state.jobs.map(j => `<div class="card" draggable="true" ondragstart="event.dataTransfer.setData('text', '${j.id}')"><b style="color:var(--focus)">${j.id}</b><br>${j.name}</div>`).join('');
        document.getElementById('rows').innerHTML = state.teams.map((t, i) => `<tr><td><b>${t}</b></td><td id="${i}-m" ondragover="event.preventDefault()" ondrop="drop(event, '${i}-m')"></td><td id="${i}-a" ondragover="event.preventDefault()" ondrop="drop(event, '${i}-a')"></td></tr>`).join('');
        Object.keys(state.cal).forEach(k => { const j = state.jobs.find(x => x.id === state.cal[k]); if(j && document.getElementById(k)) document.getElementById(k).innerHTML = `<div class="card" style="margin:0; border-color:var(--focus)"><b>${j.id}</b> — ${j.name}</div>`; });
    }
    function drop(e, id) { e.preventDefault(); const jId = e.dataTransfer.getData('text'); if(jId) { state.cal[id] = jId; render(); } }
    async function save() { await supabaseClient.from('planer_data').update({ config_json: state }).eq('id', 1); alert("In Cloud gespeichert!"); }
    async function load() { let { data } = await supabaseClient.from('planer_data').select('config_json').eq('id', 1).single(); if(data?.config_json) state = data.config_json; render(); initMap(); }
    window.onload = load;
</script>
</body>
</html>
