<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einsatzplaner – Elektro Meisterbetrieb</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10141A;
  --panel:#181E27;
  --panel-2:#1F2733;
  --line:#2C3644;
  --line-soft:#232C38;
  --ink:#E8EDF4;
  --ink-dim:#8B98AA;
  --ink-faint:#5C6878;
  --focus:#7FD4FF;
  --radius:5px;
  --slot-h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  font-size:13px;
  display:flex;flex-direction:column;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}

/* ---------- Kopfzeile ---------- */
header{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:0 1 auto;overflow:hidden}
.brand b{
  font-family:"Barlow Condensed",sans-serif;
  font-weight:700;font-size:22px;letter-spacing:.02em;
}
.brand span{color:var(--ink-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1560px){.brand span{display:none}}

.views{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.views button{
  background:none;border:0;padding:6px 13px;
  font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.03em;
  color:var(--ink-dim);border-right:1px solid var(--line);
}
.views button:last-child{border-right:0}
.views button[aria-pressed="true"]{background:var(--focus);color:#0A1119;font-weight:600}

.navdate{display:flex;align-items:center;gap:8px}
.navdate .label{
  font-family:"Barlow Condensed",sans-serif;font-size:17px;
  min-width:160px;text-align:center;letter-spacing:.02em;white-space:nowrap;
}
.ghost{
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:6px 10px;color:var(--ink-dim);white-space:nowrap;
}
.ghost:hover{border-color:var(--focus);color:var(--ink)}
.ghost.heute{border-color:#2E4A5C;color:var(--focus)}
.ghost.heute:hover{background:#16222C;border-color:var(--focus)}
.spacer{flex:1}

/* ---------- Layout ---------- */
main{flex:1;display:flex;min-height:0}
#stage{flex:1;min-width:0;overflow:auto;position:relative}

aside{
  flex:0 0 268px;border-left:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column;min-height:0;
}
aside h2{
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;
  margin:0;padding:11px 14px 9px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
aside h2 .count{color:var(--ink-faint);font-size:12px;font-family:Inter,sans-serif}
.pool{overflow:auto;padding:9px;display:flex;flex-direction:column;gap:7px;flex:1}
.jobcard{
  background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--ink-faint);
  border-radius:var(--radius);padding:8px 9px;cursor:grab;
}
.jobcard:active{cursor:grabbing}
.jobcard b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.jobcard small{color:var(--ink-dim);font-size:11.5px;line-height:1.35;display:block}
.jobcard .row{display:flex;gap:6px;margin-top:7px}
.jobcard .row button{
  flex:1;background:#141A23;border:1px solid var(--line);border-radius:4px;
  padding:3px 0;font-size:11px;color:var(--ink-dim);
}
.jobcard .row button:hover{color:var(--ink);border-color:var(--focus)}
.pool-empty{color:var(--ink-faint);padding:16px 6px;text-align:center;line-height:1.5}
.aside-foot{padding:9px;border-top:1px solid var(--line);display:flex;gap:7px}
.aside-foot button{flex:1;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel-2);padding:7px 0;font-size:12px}
.aside-foot button.primary{background:var(--focus);color:#0A1119;border-color:var(--focus);font-weight:600}

/* ---------- Planungsraster ---------- */
table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:660px;table-layout:fixed}
table.board th,table.board td{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:0}
table.board thead th{
  position:sticky;top:0;z-index:5;background:var(--panel);
  font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:14px;
  color:var(--ink-dim);padding:7px 6px;letter-spacing:.03em;border-bottom:1px solid var(--line);
}
table.board thead th.today{color:var(--focus);background:#16222C}
th.teamcol,td.teamcol{
  position:sticky;left:0;z-index:4;background:var(--panel);
  width:150px;min-width:150px;border-right:1px solid var(--line);
}
table.board thead th.teamcol{z-index:7;background:var(--panel)}
.teamcell{padding:8px 11px;display:flex;gap:9px;align-items:center;cursor:grab;position:relative}
.teamcell:active{cursor:grabbing}
.teamcell .tn{flex:1;min-width:0}
.teamcell.dragging{opacity:.4}
.teamcell.dropteam{background:#1B2735;box-shadow:inset 0 0 0 2px var(--focus)}
.order{display:flex;flex-direction:column;gap:2px;opacity:0;flex:0 0 auto}
.teamcell:hover .order{opacity:1}
.order button{
  background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  color:var(--ink-dim);font-size:8px;line-height:1;padding:3px 5px;
}
.order button:hover:not(:disabled){color:var(--ink);border-color:var(--focus)}
.order button:disabled{opacity:.25;cursor:default}
.swatch{width:5px;border-radius:3px;align-self:stretch;min-height:30px}
.teamcell b{font-size:13px;display:block}
.teamcell small{color:var(--ink-faint);font-size:11px;line-height:1.3;display:block;margin-top:2px}

td.trackcell{padding:0;position:relative}
.track{position:relative;display:grid;height:var(--slot-h);align-items:center}
.daybg{
  position:absolute;top:0;bottom:0;z-index:0;pointer-events:none;
  border-right:1px solid var(--line-soft);
}
.daybg.today{background:#16222C}
.daybg.monatsstart{border-left:2px solid #4A5566}
table.board thead th.monatsstart{border-left:2px solid #4A5566}

.bar{
  grid-row:1;position:relative;z-index:2;
  height:calc(var(--slot-h) - 8px);margin:0 2px;border-radius:5px;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:0 11px;color:#0C1117;font-size:13px;cursor:pointer;
  white-space:nowrap;overflow:hidden;
}
.bar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bar .adr{font-weight:500;font-size:11px;opacity:.75;overflow:hidden;text-overflow:ellipsis}
.bar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.bar.dragover{box-shadow:0 0 0 2px var(--focus)}

.gap{grid-row:1;position:relative;z-index:1;height:100%;cursor:pointer}
.gap::after{
  content:attr(data-slot);position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:10px;opacity:0;pointer-events:none;
}
.gap:hover{background:#1B2735;box-shadow:inset 0 0 0 1px var(--focus)}
.gap:hover::after{opacity:1}
.gap.dragover{background:#203243;box-shadow:inset 0 0 0 2px var(--focus)}

table.month{min-width:2050px;table-layout:fixed}
table.month .track{height:34px}
table.month .bar{height:26px;font-size:11px;padding:0 7px;margin:0 2px;border-radius:4px}
table.month .bar .adr{display:none}
table.month thead th{font-size:12px;padding:5px 2px}

/* ---------- Jetzt-Ansicht ---------- */
.now-wrap{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.nowcard{
  background:var(--panel);border:1px solid var(--line);border-radius:7px;
  border-top:4px solid var(--ink-faint);padding:13px 14px;
}
.nowcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nowcard h3{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em}
.nowcard .crew{color:var(--ink-faint);font-size:11.5px}
.nowcard .job{font-size:14px;font-weight:600;margin:11px 0 3px}
.nowcard .adr{color:var(--ink-dim);font-size:12px;line-height:1.4}
.progress{height:7px;border-radius:4px;background:#232C38;margin:13px 0 7px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-dim)}
.times b{color:var(--ink);font-weight:600}
.nowcard .free{color:var(--ink-faint);font-style:italic;margin:13px 0 4px;font-size:13px}
.nowcard .acts{display:flex;gap:7px;margin-top:12px}
.nowcard .acts button{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 0;font-size:11.5px;color:var(--ink-dim)}
.nowcard .acts button:hover{color:var(--ink);border-color:var(--focus)}

/* ---------- Karte ---------- */
#mapview{position:absolute;inset:0;display:flex;flex-direction:column}
#mapbar{
  display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;
}
#mapbar .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-dim)}
.leg i{width:10px;height:10px;border-radius:3px;display:block}
#map{flex:1;background:#0C1015}
.pin{
  display:flex;align-items:center;gap:5px;padding:3px 7px 3px 4px;border-radius:13px;
  font:600 11px Inter,sans-serif;color:#0C1117;white-space:nowrap;
  box-shadow:0 2px 7px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85);
}
.pin .dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.45);flex:0 0 auto}

/* ---------- Dialoge ---------- */
dialog{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:0;width:min(520px,92vw);box-shadow:0 22px 60px rgba(0,0,0,.6);
}
dialog::backdrop{background:rgba(6,9,13,.72)}
dialog h3{
  margin:0;padding:14px 18px;border-bottom:1px solid var(--line);
  font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;
}
.dlg-body{padding:16px 18px;max-height:72vh;overflow:auto}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--ink-dim);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:#0F141B;border:1px solid var(--line);border-radius:4px;
  padding:8px 10px;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);padding:8px 15px;font-size:12.5px}
.btn.primary{background:var(--focus);border-color:var(--focus);color:#0A1119;font-weight:600}
.btn.danger{color:#FF8B8B;border-color:#4A2B32}
.btn:hover{border-color:var(--focus)}
.rowlist{display:flex;flex-direction:column;gap:8px}
.rowitem{display:flex;gap:9px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.rowitem input[type=text]{flex:1;background:#0F141B;border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--ink)}
.rowitem input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.rowitem .x{background:none;border:0;color:var(--ink-faint);font-size:17px;padding:0 4px}
.rowitem .x:hover{color:#FF8B8B}
.hint{color:var(--ink-faint);font-size:11.5px;line-height:1.5;margin-top:-4px}
.pair{display:flex;gap:8px}
.pair input{flex:1;min-width:0}
.pair select{flex:0 0 150px}
.quick{display:flex;gap:7px}
.quick button{
  flex:1;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 0;font-size:12px;color:var(--ink-dim);
}
.quick button:hover{border-color:var(--focus);color:var(--ink)}
.quick button.on{background:var(--focus);border-color:var(--focus);color:#0A1119;font-weight:600}
.searchbox{position:relative;flex:1 1 180px;min-width:130px;max-width:260px}
.searchbox input{
  width:100%;background:#0F141B;border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 11px;color:var(--ink);font-size:12.5px;
}
.kdlist{display:flex;flex-direction:column;gap:8px}
.kdrow{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;
}
.kdrow:hover{border-color:var(--focus)}
.kdrow b{font-size:13px;display:block}
.kdrow small{color:var(--ink-dim);font-size:11.5px;display:block;margin-top:2px;line-height:1.4}
.kdrow .n{color:var(--ink-faint);font-size:11px;white-space:nowrap}
[hidden]{display:none !important}
</style>
</head>
<body>

<header>
  <div class="brand"><b>Einsatzplaner</b><span id="companyName">Elektro Meisterbetrieb</span></div>

  <div class="views" role="group" aria-label="Ansicht">
    <button data-view="now">Jetzt</button>
    <button data-view="week">Woche</button>
    <button data-view="month">Monat</button>
    <button data-view="map">Karte</button>
  </div>

  <div class="navdate">
    <button class="ghost" id="prev" aria-label="Zurück">◀</button>
    <div class="label" id="periodLabel"></div>
    <button class="ghost" id="next" aria-label="Vor">▶</button>
    <button class="ghost heute" id="today" title="Zum heutigen Tag springen">Heute</button>
  </div>

  <div class="spacer"></div>
  <div class="searchbox">
    <input type="search" id="qSearch" placeholder="Objekt oder Straße suchen …" autocomplete="off">
  </div>
  <button class="ghost" id="btnKunden">Kunden</button>
  <button class="ghost" id="btnTeams">Teams</button>
  <button class="ghost" id="btnSettings">Einstellungen</button>
</header>

<main>
  <div id="stage"></div>
  <aside>
    <h2>Auftragspool <span class="count" id="poolCount"></span></h2>
    <div class="pool" id="pool"></div>
    <div class="aside-foot">
      <button class="primary" id="btnNewJob">Auftrag anlegen</button>
      <button id="btnAllJobs">Alle</button>
    </div>
  </aside>
</main>

<!-- Einsatz zuweisen -->
<dialog id="dlgAssign">
  <h3 id="assignTitle">Einsatz eintragen</h3>
  <div class="dlg-body">
    <div class="field">
      <label for="asTeam">Team</label>
      <select id="asTeam"></select>
    </div>
    <div class="field">
      <label for="asJobName">Auftrag / Objekt</label>
      <input type="text" id="asJobName" list="jobNames" autocomplete="off" placeholder="z.B. Zählerschrank tauschen">
      <datalist id="jobNames"></datalist>
    </div>
    <div class="field">
      <label for="asJobAdr">Adresse</label>
      <input type="text" id="asJobAdr" autocomplete="off" placeholder="Straße Hausnummer, PLZ Ort">
    </div>
    <div class="field">
      <label for="asFrom">Von</label>
      <div class="pair">
        <input type="date" id="asFrom">
        <select id="asFromSlot">
          <option value="AM">ab morgens</option>
          <option value="PM">ab mittags</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="asTo">Bis</label>
      <div class="pair">
        <input type="date" id="asTo">
        <select id="asToSlot">
          <option value="PM">bis Feierabend</option>
          <option value="AM">nur bis mittags</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Schnellwahl für einen einzelnen Tag</label>
      <div class="quick">
        <button type="button" data-q="BOTH">Ganzer Tag</button>
        <button type="button" data-q="AM">Erste Hälfte</button>
        <button type="button" data-q="PM">Zweite Hälfte</button>
      </div>
    </div>
    <p class="hint" id="assignHint"></p>
  </div>
  <div class="dlg-foot">
    <button class="btn danger" id="asDelete" style="margin-right:auto">Einsatz löschen</button>
    <button class="btn" data-close>Abbrechen</button>
    <button class="btn primary" id="asSave">Eintragen</button>
  </div>
</dialog>

<!-- Auftrag -->
<dialog id="dlgJob">
  <h3 id="jobTitle">Auftrag anlegen</h3>
  <div class="dlg-body">
    <div class="field"><label for="jbName">Bezeichnung</label><input type="text" id="jbName" placeholder="z.B. Neubau Zählerschrank"></div>
    <div class="field"><label for="jbAdr">Adresse</label><input type="text" id="jbAdr" placeholder="Straße Hausnummer, PLZ Ort"></div>
    <div class="field"><label for="jbContact">Ansprechpartner / Telefon</label><input type="text" id="jbContact"></div>
    <div class="field"><label for="jbNote">Notiz</label><textarea id="jbNote" rows="3"></textarea></div>
  </div>
  <div class="dlg-foot">
    <button class="btn" data-close>Abbrechen</button>
    <button class="btn primary" id="jbSave">Speichern</button>
  </div>
</dialog>

<!-- Kundenliste -->
<dialog id="dlgCustomers">
  <h3>Kunden</h3>
  <div class="dlg-body">
    <div class="kdlist" id="kdList"></div>
  </div>
  <div class="dlg-foot">
    <button class="btn" data-close>Schließen</button>
    <button class="btn primary" id="kdAdd">Neuen Kunden anlegen</button>
  </div>
</dialog>

<!-- Ein Kunde -->
<dialog id="dlgCustomer">
  <h3 id="kdTitle">Kunde anlegen</h3>
  <div class="dlg-body">
    <div class="field"><label for="kdCompany">Firmenname</label><input type="text" id="kdCompany"></div>
    <div class="field"><label for="kdContact">Ansprechpartner</label><input type="text" id="kdContact"></div>
    <div class="field"><label for="kdAddress">Adresse</label><input type="text" id="kdAddress"></div>
    <div class="two">
      <div class="field"><label for="kdPhone">Telefon</label><input type="tel" id="kdPhone"></div>
      <div class="field"><label for="kdMobile">Mobil</label><input type="tel" id="kdMobile"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn danger" id="kdDelete" style="margin-right:auto">Kunde löschen</button>
    <button class="btn" data-close>Abbrechen</button>
    <button class="btn primary" id="kdSave">Speichern</button>
  </div>
</dialog>

<!-- Teams -->
<dialog id="dlgTeams">
  <h3>Teams und Besetzung</h3>
  <div class="dlg-body">
    <div class="rowlist" id="teamList"></div>
    <button class="btn" id="btnAddTeam" style="margin-top:13px">Team hinzufügen</button>
  </div>
  <div class="dlg-foot">
    <button class="btn" data-close>Schließen</button>
    <button class="btn primary" id="teamsSave">Speichern</button>
  </div>
</dialog>

<!-- Einstellungen -->
<dialog id="dlgSettings">
  <h3>Einstellungen</h3>
  <div class="dlg-body">
    <div class="field"><label for="stCompany">Betrieb</label><input type="text" id="stCompany"></div>
    <div class="two">
      <div class="field"><label for="stAmS">Vormittag von</label><input type="time" id="stAmS"></div>
      <div class="field"><label for="stAmE">Vormittag bis</label><input type="time" id="stAmE"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn" data-close>Abbrechen</button>
    <button class="btn primary" id="stSave">Speichern</button>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const PALETTE = ["#F2B01E","#2FA8E0","#E04F5F","#59C26A","#A77BF3","#FF8A3D","#35D0C3","#E86BB0","#9FD356","#6E8BFF"];
const STORE_KEY = "einsatzplaner.v1";

const uid = () => Math.random().toString(36).slice(2,10);

function demoState(){
  const t = (name,color,members)=>({id:uid(),name,color,members});
  const j = (name,address,lat,lng,contact="")=>({id:uid(),name,address,lat,lng,contact,note:""});
  const teams = [
    t("Team 1","#F2B01E",["Anton","Igor"]),

const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const DSHORT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parse(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
const todayISO = ()=>iso(new Date());

let zoomWeek=null, monthVisible=12, pendingScrollToday=true, view="month";
let anchor=new Date(); anchor.setHours(0,0,0,0);
let mapFocusJob=null, mapDay=todayISO();

const teamById=id=>state.teams.find(t=>t.id===id);
const kundeById=id=>state.customers.find(k=>k.id===id);
const jobById=id=>state.jobs.find(j=>j.id===id);
const assignAt=(teamId,date,slot)=>state.assignments.find(a=>a.teamId===teamId&&a.date===date&&a.slot===slot);
const assignsOn=date=>state.assignments.filter(a=>a.date===date);
function plannedJobIds(){return new Set(state.assignments.map(a=>a.jobId));}
function slotTimes(){const s=state.settings;return{AM:[s.amStart,s.amEnd],PM:[s.pmStart,s.pmEnd]};}
function atTime(dateStr,hm){const d=parse(dateStr);const[h,m]=hm.split(":").map(Number);d.setHours(h,m,0,0);return d;}
function currentSlot(now=new Date()){
  const t=slotTimes(), d=iso(now);
  if(now<atTime(d,t.AM[0])) return null;
  if(now<=atTime(d,t.AM[1])) return "AM";
  if(now<atTime(d,t.PM[0])) return "PM";
  if(now<=atTime(d,t.PM[1])) return "PM";
  return null;
}
function neighborSlot(dateStr,slot,dir){
  if(dir<0) return slot==="PM" ? [dateStr,"AM"] : [iso(addDays(parse(dateStr),-1)),"PM"];
  return slot==="AM" ? [dateStr,"PM"] : [iso(addDays(parse(dateStr),1)),"AM"];
}
function runFor(teamId,jobId,dateStr,slot){
  const order=["AM","PM"];
  const step=(d,s,dir)=>{
    let i=order.indexOf(s)+dir, day=d;
    if(i<0){i=1;day=iso(addDays(parse(d),-1));}
    if(i>1){i=0;day=iso(addDays(parse(d),1));}
    return [day,order[i]];
  };
  let first=[dateStr,slot], last=[dateStr,slot], count=1;
  for(;;){const p=step(first[0],first[1],-1),a=assignAt(teamId,p[0],p[1]);
    if(a&&a.jobId===jobId){first=p;count++;}else break;}
  for(;;){const p=step(last[0],last[1],1),a=assignAt(teamId,p[0],p[1]);
    if(a&&a.jobId===jobId){last=p;count++;}else break;}
  return {first,last,count};
}
function fmtDur(ms){
  if(ms<0) ms=0;
  const h=Math.floor(ms/3600000), m=Math.round(ms%3600000/60000);
  if(h===0) return m+" Min";
  return h+" Std "+(m?m+" Min":"");
}

}

function renderNow(){
  const now=new Date(), d=todayISO(), slot=currentSlot(now), t=slotTimes();
  const wrap=document.createElement("div"); wrap.className="now-wrap";

    if(a){

      const r=runFor(team.id,a.jobId,d,slot);
      const start=atTime(r.first[0], r.first[1]==="AM"?t.AM[0]:t.PM[0]);
      const end=atTime(r.last[0], r.last[1]==="AM"?t.AM[1]:t.PM[1]);
      const pct=Math.max(0,Math.min(100,(now-start)/(end-start)*100));
      html+=`<div class="job">${esc(job.name)}</div>
        <div class="adr">${esc(job.address)}</div>
        <div class="progress"><i style="width:${pct.toFixed(1)}%;background:${team.color}"></i></div>

          <span>seit <b>${fmtDur(now-start)}</b></span>

}

function buildBoard(dates,isMonth){
  const n=dates.length;
  const tbl=document.createElement("table");
  tbl.className="board"+(isMonth?" month":"");
  const th=document.createElement("thead"), tr=document.createElement("tr");
  tr.innerHTML=`<th class="teamcol">Team</th>`;
  dates.forEach(d=>{
    const h=document.createElement("th");
    h.textContent=isMonth?`${DSHORT[(d.getDay()+6)%7]} ${d.getDate()}.${d.getMonth()+1}.`:`${DAYS[(d.getDay()+6)%7]} ${d.getDate()}.${d.getMonth()+1}.`;
    if(iso(d)===todayISO()) h.className="today";
    tr.appendChild(h);
  });
  th.appendChild(tr); tbl.appendChild(th);

  const tb=document.createElement("tbody");
  state.teams.forEach((team)=>{
    const row=document.createElement("tr");
    const tc=document.createElement("td"); tc.className="teamcol";
    tc.innerHTML=`<div class="teamcell"><span class="swatch" style="background:${team.color}"></span><b>${esc(team.name)}</b></div>`;
    row.appendChild(tc);

    const td=document.createElement("td"); td.colSpan=n; td.className="trackcell";
    const track=document.createElement("div"); track.className="track";
    track.style.gridTemplateColumns=`repeat(${n*2},1fr)`;

    const units=[];
    dates.forEach(d=>{const ds=iso(d);["AM","PM"].forEach(s=>units.push({ds,s,a:assignAt(team.id,ds,s)}));});

    let i=0;
    while(i<units.length){
      const u=units[i];
      if(u.a){
        let j=i+1;
        while(j<units.length && units[j].a && units[j].a.jobId===u.a.jobId) j++;
        track.appendChild(makeBar(team,u.a.jobId,units[i],units[j-1],j-i,isMonth));
        i=j;
      }else{
        let span=1, full=false;
        if(u.s==="AM" && units[i+1] && units[i+1].ds===u.ds && !units[i+1].a){span=2;full=true;}
        track.appendChild(makeGap(team,u.ds,u.s,span,full));
        i+=span;
      }
    }
    td.appendChild(track); row.appendChild(td); tb.appendChild(row);
  });
  tbl.appendChild(tb);
  return tbl;
}

function makeBar(team,jobId,firstU,lastU,span,isMonth){
  const job=jobById(jobId)||{name:"?",address:""};
  const b=document.createElement("div");
  b.className="bar";
  b.style.gridColumn="span "+span;
  b.style.background=team.color;
  b.innerHTML=`<span class="nm">${esc(job.name)}</span>`;
  b.onclick=()=>openRun(team.id,jobId,firstU.ds,firstU.s);
  return b;
}

function makeGap(team,ds,slot,span,full){
  const c=document.createElement("div");
  c.className="gap";
  c.style.gridColumn="span "+span;
  c.onclick=()=>openNew(team.id,ds,slot,full);
  return c;
}
